<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexico-Dico: Gen Z Wörterbuch</title>
<link rel="apple-touch-icon" href="https://i.ibb.co/LzNf0Ym/dico-eclair.png">
<link rel="icon" href="https://i.ibb.co/LzNf0Ym/dico-eclair.png">


<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .container {
            background-color: white;
            width: 95%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: #3f51b5;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #3f51b5;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #303f9f;
        }

        .stats {
            font-size: 12px;
            color: #888;
            margin-bottom: 25px;
        }

        .popular-title {
            color: #3f51b5;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .suggestion-item {
            font-size: 13px;
            color: #444;
            cursor: pointer;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.2s;
            border: 1px solid #eee;
        }

        .suggestion-item:hover {
            background: #eef0f7;
            color: #3f51b5;
            border-color: #3f51b5;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background-color: #f9f9f9;
            text-align: left;
            border-left: 5px solid #3f51b5;
            display: none;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Lexico-Dico: Online Wörterbuch der Gen Z 🌐</h1>
        </div>

        <p class="description">
            Entdecke die Bedeutung von Ausdrücken und Vokabeln der heutigen Generation. 
            Gib ein Wort ein, um dessen Definition, Beispiele und die französische Übersetzung zu erhalten.
        </p>

        <div class="search-box">
            <input id="mot" list="suggestions" type="text" placeholder="Ex. cringe, YOLO, lost..." onkeypress="handleKeyPress(event)">
            <datalist id="suggestions"></datalist>
            <button onclick="chercher()">🔍 Suchen</button>
        </div>

        <div class="stats" id="countDisplay">
            📊 Wörterbuch wird geladen...
        </div>

        <div class="popular-section">
            <div class="popular-title">📍 Populäre Vorschläge</div>
            <div class="suggestions-grid" id="popularGrid">
                </div>
        </div>

        <div id="result"></div>
    </div>

    <script>

        // Initialisation
        const datalist = document.getElementById("suggestions");
        const popularGrid = document.getElementById("popularGrid");
        const countDisplay = document.getElementById("countDisplay");
        
        const words = Object.keys(dictionnaire);
        countDisplay.innerHTML = `📊 Über ${words.length} Wörter und Ausdrücke verfügbar`;

        words.forEach((word, index) => {
            // Ajouter à la liste de recherche
            let option = document.createElement("option");
            option.value = word;
            datalist.appendChild(option);

            // Ajouter aux suggestions visuelles (on en met 12 par défaut pour le look)
            if (index < 12) {
                let item = document.createElement("div");
                item.className = "suggestion-item";
                item.innerText = word;
                item.onclick = () => fillSearch(word);
                popularGrid.appendChild(item);
            }
        });

        function chercher() {
            let mot = document.getElementById("mot").value.trim();
            let resultDiv = document.getElementById("result");

            if (dictionnaire[mot]) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = "<strong>" + mot + "</strong> : " + dictionnaire[mot];
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = "<span style='color:red;'>Wort nicht gefunden.</span> Bitte achte auf die richtige Schreibweise.";
            }
        }

        function fillSearch(word) {
            document.getElementById("mot").value = word;
            chercher();
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                chercher();
            }
        }
    </script>
</body>
</html>
